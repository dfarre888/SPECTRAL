apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: spectral-operations
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | quote }}
  supabase-service-role-key: {{ .Values.secrets.supabaseServiceRoleKey | quote }}
  aws-access-key-id: {{ .Values.secrets.awsAccessKeyId | quote }}
  aws-secret-access-key: {{ .Values.secrets.awsSecretAccessKey | quote }}
  bedrock-model-id: {{ .Values.secrets.bedrockModelId | quote }}
