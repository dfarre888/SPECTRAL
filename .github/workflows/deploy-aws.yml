name: SPECTRAL — Build & Deploy to AWS EKS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'research/**'
      - 'slides/**'

  # Manual trigger with optional tag override
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (default: git SHA)'
        required: false
        default: ''
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

env:
  AWS_REGION: ap-southeast-2
  ECR_REPO: spectral-operations
  EKS_CLUSTER: spectral-eks
  HELM_RELEASE: spectral
  HELM_CHART: ./deploy/helm/spectral-operations
  HELM_VALUES_BASE: ./deploy/helm/spectral-operations/values.yaml
  HELM_VALUES_AWS: ./deploy/helm/spectral-operations/values-aws.yaml

jobs:
  # ── 1. Build & push Docker image to ECR ─────────────────────────────────────
  build:
    name: Build → ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      ecr_uri: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}

    permissions:
      id-token: write   # for OIDC → AWS assume-role
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.sha }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/spectral-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repo if missing
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPO" \
            --region "$AWS_REGION" > /dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$ECR_REPO" \
            --region "$AWS_REGION" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.meta.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
          # Cache layers via ECR (no extra cost, reuses layer cache)
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:buildcache,mode=max

  # ── 2. Helm deploy to EKS ────────────────────────────────────────────────────
  deploy:
    name: Deploy → EKS
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event.inputs.environment || 'staging' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/spectral-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER" \
            --region "$AWS_REGION"

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Helm upgrade / install
        run: |
          helm upgrade "$HELM_RELEASE" "$HELM_CHART" \
            --install \
            --atomic \
            --timeout 5m \
            --values "$HELM_VALUES_BASE" \
            --values "$HELM_VALUES_AWS" \
            --set image.repository="${{ needs.build.outputs.ecr_uri }}" \
            --set image.tag="${{ needs.build.outputs.image_tag }}" \
            --set ingress.host="${{ secrets.SPECTRAL_HOST }}" \
            --namespace spectral \
            --create-namespace

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/spectral-web \
            --namespace spectral \
            --timeout=300s

      - name: Smoke test
        run: |
          HOST="${{ secrets.SPECTRAL_HOST }}"
          echo "→ Health check: https://${HOST}/api/health"
          curl -sf "https://${HOST}/api/health" | jq .
